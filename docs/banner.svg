<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Mofal Form</title><desc id="desc">Thoughtful forms for Angular, with a sample form card.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211d45"/><stop offset=".58" stop-color="#49399b"/><stop offset="1" stop-color="#755ee5"/></linearGradient>
  <linearGradient id="orb" x2="1" y2="1"><stop stop-color="#aa9cff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0c0831" flood-opacity=".24"/></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<circle cx="1140" cy="54" r="285" fill="url(#orb)"/><circle cx="790" cy="320" r="165" fill="#9c87ff" opacity=".11"/>
<rect x="56" y="49" width="40" height="40" rx="12" fill="#8873fa"/><text x="65" y="79" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="28">m.</text>
<text x="109" y="77" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="24">Mofal Form</text>
<rect x="56" y="125" width="190" height="27" rx="13.5" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".23"/>
<text x="71" y="143" fill="#dcd5ff" font-family="Arial,sans-serif" font-weight="700" font-size="10" letter-spacing="2">ANGULAR COMPONENTS</text>
<text x="56" y="212" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="54" letter-spacing="-2">Forms that feel</text>
<text x="56" y="274" fill="#c4b8ff" font-family="Arial,sans-serif" font-weight="700" font-size="54" letter-spacing="-2">effortless.</text>
<text x="58" y="313" fill="#d9d2fa" font-family="Arial,sans-serif" font-size="17">Clean fields. Clear validation. Your design.</text>
<g filter="url(#shadow)">
  <rect x="800" y="48" width="331" height="295" rx="20" fill="#fff"/>
  <text x="829" y="87" fill="#7864e4" font-family="Arial,sans-serif" font-weight="700" font-size="10" letter-spacing="2">GET IN TOUCH</text>
