  <text x="829" y="248" fill="#303a54" font-family="Arial,sans-serif" font-weight="700" font-size="11">Email address</text>
  <rect x="829" y="258" width="273" height="37" rx="8" fill="#fafbff" stroke="#e3e6ee"/><text x="842" y="281" fill="#9ea9ba" font-family="Arial,sans-serif" font-size="11">alex@example.com</text>
  <rect x="829" y="309" width="273" height="26" rx="8" fill="#7059e8"/><text x="925" y="327" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="11">Send message  →</text>
